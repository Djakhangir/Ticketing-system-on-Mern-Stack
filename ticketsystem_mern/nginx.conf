server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed static assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: all client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
